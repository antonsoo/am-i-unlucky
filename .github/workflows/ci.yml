name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Node formats numbers and dates for the locale it starts in. Output that must not
      # change with the reader's locale is tested in one that writes 1.234,5.
      - name: Test again in a comma-decimal locale
        run: npm test
        env:
          LC_ALL: de_DE.UTF-8
          LANG: de_DE.UTF-8
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser

  oracle-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Regenerate SciPy oracle fixtures and diff against committed copy
        run: |
          uv run --with scipy python3 scripts/oracle.py
          git diff --exit-code tests/oracle/fixtures.json
      - name: Regenerate independent Decimal schedule fixtures
        run: |
          python3 scripts/time-oracle.py
          git diff --exit-code tests/oracle/time-fixtures.json
      - name: Regenerate independent Decimal collection fixtures
        run: |
          python3 scripts/collection-oracle.py
          git diff --exit-code tests/oracle/collection-fixtures.json
